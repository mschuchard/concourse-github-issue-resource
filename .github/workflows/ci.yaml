---
name: ci

on:
  push:
    branches: [master]
    paths:
    - '**.rs'
  pull_request:
    branches: [master]
    paths:
    - '**.rs'

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: lint
      run: cargo fmt -- --check
    - name: build
      run: cargo build
    - name: test
      run: cargo test
